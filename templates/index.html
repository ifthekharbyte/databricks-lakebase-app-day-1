<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Watchlist - Databricks Lakebase</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 12px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .subtitle {
      font-size: 18px;
      opacity: 0.95;
      font-weight: 300;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      margin-bottom: 24px;
    }

    .hint {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.6;
      padding: 12px 16px;
      background: #f3f4f6;
      border-left: 4px solid #667eea;
      border-radius: 4px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      color: #374151;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    input[type="text"]::placeholder {
      color: #9ca3af;
    }

    button {
      margin-top: 20px;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      width: 100%;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.5);
    }

    button:active {
      transform: translateY(0);
    }

    #result {
      margin-top: 20px;
      padding: 16px 20px;
      background: #f0fdf4;
      border: 1px solid #86efac;
      border-radius: 8px;
      font-size: 15px;
      line-height: 1.6;
      color: #166534;
      min-height: 20px;
      display: none;
    }

    #result.show {
      display: block;
      animation: slideDown 0.3s ease;
    }

    #result.error {
      background: #fef2f2;
      border-color: #fca5a5;
      color: #991b1b;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #1f2937;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
    }

    thead {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    th {
      text-align: left;
      padding: 16px;
      font-size: 13px;
      font-weight: 700;
      color: white;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    th:first-child {
      border-top-left-radius: 8px;
    }

    th:last-child {
      border-top-right-radius: 8px;
    }

    tbody tr {
      transition: background 0.2s ease;
    }

    tbody tr:hover {
      background: #f9fafb;
    }

    tbody tr:last-child td:first-child {
      border-bottom-left-radius: 8px;
    }

    tbody tr:last-child td:last-child {
      border-bottom-right-radius: 8px;
    }

    td {
      text-align: left;
      padding: 16px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 15px;
      color: #374151;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    td:nth-child(1) {
      font-weight: 700;
      color: #667eea;
      font-size: 16px;
    }

    td:nth-child(3) {
      font-weight: 600;
      color: #059669;
    }

    td:nth-child(4) {
      color: #6b7280;
      font-size: 13px;
    }

    .delete-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .delete-btn:hover {
      background: #dc2626;
      transform: scale(1.05);
    }

    .delete-btn:active {
      transform: scale(0.98);
    }

    .news-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
      margin-right: 6px;
    }

    .news-btn:hover {
      background: #2563eb;
      transform: scale(1.05);
    }

    .news-btn:active {
      transform: scale(0.98);
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
    }

    .modal.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: white;
      border-radius: 16px;
      max-width: 800px;
      max-height: 80vh;
      width: 90%;
      overflow-y: auto;
      padding: 32px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.4);
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .modal-title {
      font-size: 24px;
      font-weight: 700;
      color: #1f2937;
    }

    .close-btn {
      background: #f3f4f6;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      transition: all 0.2s ease;
    }

    .close-btn:hover {
      background: #e5e7eb;
      transform: rotate(90deg);
    }

    .news-item {
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 0;
    }

    .news-item:last-child {
      border-bottom: none;
    }

    .news-title {
      font-size: 16px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 8px;
    }

    .news-meta {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .news-description {
      font-size: 14px;
      color: #4b5563;
      line-height: 1.6;
      margin-bottom: 8px;
    }

    .news-link {
      display: inline-block;
      color: #3b82f6;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .news-link:hover {
      color: #2563eb;
      text-decoration: underline;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #9ca3af;
    }

    @media (max-width: 640px) {
      h1 {
        font-size: 32px;
      }

      .card {
        padding: 24px;
      }

      table {
        font-size: 14px;
      }

      th, td {
        padding: 12px 8px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📈 Stock Watchlist</h1>
      <p class="subtitle">Track your favorite stocks powered by Databricks Lakebase</p>
    </div>

    <div class="card">
      <p class="hint">💡 Enter a single ticker symbol. This sends exactly ONE call to the Massive API to fetch the latest price, then adds it to your watchlist.</p>

      <form id="stock-form">
        <label for="symbol">Ticker Symbol</label>
        <input type="text" id="symbol" name="symbol" placeholder="e.g., AAPL, MSFT, GOOGL" required>
        <button type="submit">➕ Add to Watchlist</button>
      </form>

      <div id="result"></div>
    </div>

    <div class="card">
      <h2>Your Watchlist</h2>
      <div class="table-container">
        <table id="watchlist-table">
          <thead>
            <tr>
              <th>Symbol</th>
              <th>Email</th>
              <th>Latest Price</th>
              <th>Updated</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="watchlist-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- News Modal -->
  <div id="newsModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">News for <span id="modalSymbol"></span></h3>
        <button class="close-btn" onclick="closeNewsModal()">&times;</button>
      </div>
      <div id="newsContent"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById("stock-form");
    const resultEl = document.getElementById("result");
    const watchlistBody = document.getElementById("watchlist-body");

    async function loadWatchlist() {
      try {
        const resp = await fetch("/watchlist");
        const data = await resp.json();
        if (!resp.ok) {
          showResult("Error loading watchlist: " + (data.error || resp.statusText), true);
          return;
        }
        watchlistBody.innerHTML = "";
        if (data.length === 0) {
          watchlistBody.innerHTML = '<tr><td colspan="5" class="empty-state">No stocks in your watchlist yet. Add one above!</td></tr>';
        } else {
          data.forEach((row) => {
            const tr = document.createElement("tr");
            const price = row.latest_price !== null && row.latest_price !== undefined
              ? "$" + Number(row.latest_price).toFixed(2)
              : "-";
            const updated = row.updated_at ? new Date(row.updated_at).toLocaleString() : "-";
            tr.innerHTML = `<td>${row.symbol}</td><td>${row.email || "-"}</td><td>${price}</td><td>${updated}</td><td><button class="news-btn" onclick="viewNews('${row.symbol}')">📰 News</button><button class="delete-btn" onclick="deleteStock('${row.symbol}')">🗑️ Delete</button></td>`;
            watchlistBody.appendChild(tr);
          });
        }
      } catch (err) {
        showResult("Failed to load watchlist: " + err, true);
      }
    }

    function showResult(message, isError = false) {
      resultEl.textContent = message;
      resultEl.className = isError ? 'show error' : 'show';
      setTimeout(() => {
        if (!isError) {
          resultEl.className = '';
        }
      }, 5000);
    }

    async function deleteStock(symbol) {
      if (!confirm(`Are you sure you want to remove ${symbol} from your watchlist?`)) {
        return;
      }

      showResult(`Removing ${symbol}...`, false);

      try {
        const resp = await fetch(`/watchlist/${symbol}`, {
          method: "DELETE",
        });
        const data = await resp.json();
        if (!resp.ok) {
          showResult("Error: " + (data.error || resp.statusText), true);
          return;
        }
        showResult(`✅ Removed ${symbol} from watchlist`, false);
        loadWatchlist();
      } catch (err) {
        showResult("Request failed: " + err, true);
      }
    }

    async function viewNews(symbol) {
      const modal = document.getElementById("newsModal");
      const modalSymbol = document.getElementById("modalSymbol");
      const newsContent = document.getElementById("newsContent");

      modalSymbol.textContent = symbol;
      newsContent.innerHTML = '<p style="text-align:center;color:#6b7280;">Loading news...</p>';
      modal.classList.add("show");

      try {
        const resp = await fetch(`/news/${symbol}`);
        const data = await resp.json();

        if (!resp.ok) {
          newsContent.innerHTML = `<p style="color:#ef4444;">${data.error || "Failed to load news"}</p>`;
          return;
        }

        if (!data.news || data.news.length === 0) {
          newsContent.innerHTML = '<p style="text-align:center;color:#6b7280;">No news found for this ticker.</p>';
          return;
        }

        let newsHtml = '';
        data.news.forEach((article) => {
          const publishedDate = article.published_utc ? new Date(article.published_utc).toLocaleDateString() : 'Unknown date';
          newsHtml += `
            <div class="news-item">
              <div class="news-title">${article.title || 'Untitled'}</div>
              <div class="news-meta">${article.author || 'Unknown author'} • ${publishedDate}</div>
              ${article.description ? `<div class="news-description">${article.description}</div>` : ''}
              ${article.article_url ? `<a href="${article.article_url}" target="_blank" class="news-link">Read full article →</a>` : ''}
            </div>
          `;
        });

        newsContent.innerHTML = newsHtml;
      } catch (err) {
        newsContent.innerHTML = `<p style="color:#ef4444;">Error loading news: ${err.message}</p>`;
      }
    }

    function closeNewsModal() {
      document.getElementById("newsModal").classList.remove("show");
    }

    // Close modal when clicking outside
    document.getElementById("newsModal").addEventListener("click", (e) => {
      if (e.target.id === "newsModal") {
        closeNewsModal();
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const symbol = document.getElementById("symbol").value;
      showResult("Adding to watchlist...", false);

      try {
        const resp = await fetch("/watchlist", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ symbol }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          showResult("Error: " + (data.error || resp.statusText), true);
          return;
        }
        showResult("✅ Added " + data.symbol + " at $" + Number(data.latest_price).toFixed(2), false);
        document.getElementById("symbol").value = "";
        loadWatchlist();
      } catch (err) {
        showResult("Request failed: " + err, true);
      }
    });

    loadWatchlist();
  </script>
</body>
</html>
