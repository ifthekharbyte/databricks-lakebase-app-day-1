<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Watchlist - Databricks Lakebase</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 12px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .subtitle {
      font-size: 18px;
      opacity: 0.95;
      font-weight: 300;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      margin-bottom: 24px;
    }

    .hint {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.6;
      padding: 12px 16px;
      background: #f3f4f6;
      border-left: 4px solid #667eea;
      border-radius: 4px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      color: #374151;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    input[type="text"]::placeholder {
      color: #9ca3af;
    }

    button {
      margin-top: 20px;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      width: 100%;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.5);
    }

    button:active {
      transform: translateY(0);
    }

    #result {
      margin-top: 20px;
      padding: 16px 20px;
      background: #f0fdf4;
      border: 1px solid #86efac;
      border-radius: 8px;
      font-size: 15px;
      line-height: 1.6;
      color: #166534;
      min-height: 20px;
      display: none;
    }

    #result.show {
      display: block;
      animation: slideDown 0.3s ease;
    }

    #result.error {
      background: #fef2f2;
      border-color: #fca5a5;
      color: #991b1b;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #1f2937;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
    }

    thead {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    th {
      text-align: left;
      padding: 16px;
      font-size: 13px;
      font-weight: 700;
      color: white;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    th:first-child {
      border-top-left-radius: 8px;
    }

    th:last-child {
      border-top-right-radius: 8px;
    }

    tbody tr {
      transition: background 0.2s ease;
    }

    tbody tr:hover {
      background: #f9fafb;
    }

    tbody tr:last-child td:first-child {
      border-bottom-left-radius: 8px;
    }

    tbody tr:last-child td:last-child {
      border-bottom-right-radius: 8px;
    }

    td {
      text-align: left;
      padding: 16px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 15px;
      color: #374151;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    td:nth-child(1) {
      font-weight: 700;
      color: #667eea;
      font-size: 16px;
    }

    td:nth-child(3) {
      font-weight: 600;
      color: #059669;
    }

    td:nth-child(4) {
      color: #6b7280;
      font-size: 13px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #9ca3af;
    }

    @media (max-width: 640px) {
      h1 {
        font-size: 32px;
      }

      .card {
        padding: 24px;
      }

      table {
        font-size: 14px;
      }

      th, td {
        padding: 12px 8px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📈 Stock Watchlist</h1>
      <p class="subtitle">Track your favorite stocks powered by Databricks Lakebase</p>
    </div>

    <div class="card">
      <p class="hint">💡 Enter a single ticker symbol. This sends exactly ONE call to the Massive API to fetch the latest price, then adds it to your watchlist.</p>

      <form id="stock-form">
        <label for="symbol">Ticker Symbol</label>
        <input type="text" id="symbol" name="symbol" placeholder="e.g., AAPL, MSFT, GOOGL" required>
        <button type="submit">➕ Add to Watchlist</button>
      </form>

      <div id="result"></div>
    </div>

    <div class="card">
      <h2>Your Watchlist</h2>
      <div class="table-container">
        <table id="watchlist-table">
          <thead>
            <tr>
              <th>Symbol</th>
              <th>Email</th>
              <th>Latest Price</th>
              <th>Updated</th>
            </tr>
          </thead>
          <tbody id="watchlist-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("stock-form");
    const resultEl = document.getElementById("result");
    const watchlistBody = document.getElementById("watchlist-body");

    async function loadWatchlist() {
      try {
        const resp = await fetch("/watchlist");
        const data = await resp.json();
        if (!resp.ok) {
          showResult("Error loading watchlist: " + (data.error || resp.statusText), true);
          return;
        }
        watchlistBody.innerHTML = "";
        if (data.length === 0) {
          watchlistBody.innerHTML = '<tr><td colspan="4" class="empty-state">No stocks in your watchlist yet. Add one above!</td></tr>';
        } else {
          data.forEach((row) => {
            const tr = document.createElement("tr");
            const price = row.latest_price !== null && row.latest_price !== undefined
              ? "$" + Number(row.latest_price).toFixed(2)
              : "-";
            const updated = row.updated_at ? new Date(row.updated_at).toLocaleString() : "-";
            tr.innerHTML = `<td>${row.symbol}</td><td>${row.email || "-"}</td><td>${price}</td><td>${updated}</td>`;
            watchlistBody.appendChild(tr);
          });
        }
      } catch (err) {
        showResult("Failed to load watchlist: " + err, true);
      }
    }

    function showResult(message, isError = false) {
      resultEl.textContent = message;
      resultEl.className = isError ? 'show error' : 'show';
      setTimeout(() => {
        if (!isError) {
          resultEl.className = '';
        }
      }, 5000);
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const symbol = document.getElementById("symbol").value;
      showResult("Adding to watchlist...", false);

      try {
        const resp = await fetch("/watchlist", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ symbol }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          showResult("Error: " + (data.error || resp.statusText), true);
          return;
        }
        showResult("✅ Added " + data.symbol + " at $" + Number(data.latest_price).toFixed(2), false);
        document.getElementById("symbol").value = "";
        loadWatchlist();
      } catch (err) {
        showResult("Request failed: " + err, true);
      }
    });

    loadWatchlist();
  </script>
</body>
</html>
